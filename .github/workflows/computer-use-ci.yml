name: Computer-Use Agent CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax Check Agent & Tools
        run: |
          python3 -m py_compile computer_use_agent.py
      - name: Run Validation Script
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh
